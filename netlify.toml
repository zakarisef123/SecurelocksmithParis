# Le site est régénéré à chaque déploiement à partir de _src/ (Python, sans dépendance).
[build]
  command = "python3 _src/build.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.12"

# Les sources du générateur ne sont pas publiques
[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

# Anciennes adresses de l'ancien site
[[redirects]]
  from = "/english-locksmith-paris"
  to = "/"
  status = 301

[[redirects]]
  from = "/cerrajero-paris"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
